aside{background:var(--n);color:#c5d3ee;padding:16px 10px;position:sticky;top:0;height:100vh}

aside a:hover{background:var(--n2)}aside a.on{background:var(--ac);color:#fff}
main{padding:20px;min-width:0}
.top{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}.top h1{font-size:21px;margin:0;flex:1}
input,select,button{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;max-width:100%}
button{cursor:pointer;background:var(--ac);color:#fff;border:0}

.k{font-size:24px;font-weight:700}.mu{color:var(--mu);font-size:12px}
.tag{display:inline-block;font-size:11px;background:#3b82f620;color:var(--ac);padding:2px 8px;border-radius:99px;margin:0 4px 4px 0}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}.bar span{width:105px;flex:none}.bar i{display:block;height:8px;border-radius:4px;background:var(--ac);flex:none}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left;font-size:13px}.sc{overflow-x:auto}
svg text{fill:var(--mu);font-size:9px}
details{border-bottom:1px solid var(--bd);padding:9px 0}summary{cursor:pointer;font-weight:600}
.row{display:flex;gap:12px;flex-wrap:wrap}
.chat{display:flex;flex-direction:column;height:min(560px,70vh)}.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px}
.m{max-width:85%;padding:9px 12px;border-radius:12px;white-space:pre-wrap}.m.u{align-self:flex-end;background:var(--ac);color:#fff}.m.a{align-self:flex-start;background:var(--bg);border:1px solid var(--bd)}
.tag[onclick]{cursor:pointer}.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));border-radius:99px;padding:10px 16px;box-shadow:0 4px 14px #0004}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{position:static;height:auto;display:flex;overflow-x:auto;padding:8px}.logo{display:none}aside a{white-space:nowrap}}

`<div class="g2"><div class="cd"><h3>Main exported products</h3>${tg(c.E)}<h3 style="margin-top:14px">Main imported products</h3>${tg(c.M)}</div><div class="cd"><h3>Total trade, all countries ($B)</h3>${bars(C.map(x=>[x.n,x.ex+x.im]).sort((a,b)=>b[1]-a[1]),v=>f(v,0),c.n)}</div></div>`+src};
V.lab=()=>`<div class="cd w"><div class="g4" style="margin:0">${sel("ind",IO(),"Industry")}${sel("c",CO(),"Target country")}${sel("st",[["a","Penetration (−20% price)"],["b","Premium (+25% price)"],["c","Market match"]],"Pricing strategy")}${num("pr","Home price ($)")}${num("uc","Home unit cost ($)")}${num("fx","Setup and marketing ($k)")}<label class="mu">Target share: <b id="shv">${S.sh}</b>%<br><input type="range" min="0.1" max="5" step="0.1" value="${S.sh}" oninput="S.sh=+this.value;$('#shv').textContent=S.sh;calc()"></label></div></div><div id="out"></div>`;
function calc(){let c=cy(S.c),I=IND[S.ind],gpc=c.g*1000/c.p,st={a:[.8,1.5],b:[1.25,.6],c:[1,1]}[S.st],pr=S.pr*st[0],uc=S.uc*cost(c),cu=c.p*1e6*I.p*Math.min(gpc,60)/60,un=cu*S.sh/100*st[1],rv=un*pr,pf=rv-un*uc-S.fx*1e3,be=pr>uc?S.fx*1e3/(pr-uc):0,a=I.a.split(",")[0],rk=risk(c);
$("#out").innerHTML=kp([["Serviceable customers",n(cu)],["Units per year",n(un)],["Revenue",usd(rv)],["Profit",usd(pf),pf<0?"bad":"ok"]])+
`<div class="g2"><div class="cd"><h3>Unit economics in ${c.n}</h3><table><tr><td>Local price</td><td>$${f(pr,2)}</td></tr><tr><td>Local unit cost (index ${f(cost(c),2)})</td><td>$${f(uc,2)}</td></tr><tr><td>Margin per unit</td><td>$${f(pr-uc,2)}</td></tr><tr><td>Break-even volume</td><td>${be?n(be)+" units":"not reachable"}</td></tr></table><p>${pf>0?`Profitable at this share. `:`Loss-making at this share: raise price, cut cost or lower setup spend. `}Simplified model on sample assumptions.</p></div><div class="cd"><h3>Operating cost comparison (unit cost, $)</h3>${bars(C.map(x=>[x.n,S.uc*cost(x)]).sort((x,y)=>x[1]-y[1]),v=>"$"+f(v,2),c.n)}</div></div>
<div class="cd"><h3>Expansion plan</h3><table><tr><td><b>Months 0–6</b></td><td>Pilot with ${a}; sign a local distributor; confirm import rules and tariffs.</td></tr><tr><td><b>Months 6–18</b></td><td>${S.st=="a"?"Launch with penetration pricing":S.st=="b"?"Launch with premium positioning":"Launch at market price"}; localise brand and support; hire a country lead.</td></tr><tr><td><b>Months 18–36</b></td><td>Scale to neighbours such as ${c.P[0]}; reinvest profit; ${rk>50?"hedge currency exposure and review risk quarterly.":"review pricing yearly."}</td></tr></table></div>`}
function rep(){let c=cy(S.c),I=IND[S.ind],o=opp(c,S.ind),rk=risk(c),sz=c.g*1000*I.s,a=I.a.split(","),q=(t,b)=>`<div class="cd w"><h3>${t}</h3>${b}</div>`;
return q("Executive summary",`<p>${c.n} offers a ${o>=70?"strong":o>=55?"moderate":"selective"} opportunity for ${S.ind} ventures (opportunity ${o}/100, risk ${rk}/100). The addressable market is about $${f(sz,0)}B, growing roughly ${I.g}% a year.</p>`)+
q("Market overview",`<p>${c.n} has ${c.p}M people and a $${c.g}T economy. Main industries: ${c.I.join(", ")}. Top partners: ${c.P.join(", ")}.</p>`)+
q("Economic indicators",`<p>GDP $${c.g}T; growth ${c.gr}%; inflation ${c.i}%; unemployment ${c.u}%; exports $${c.ex}B; imports $${c.im}B.</p>`)+
q("Competitor analysis",`<p>${I.c.split(",").join("; ")}.</p>`)+
q("SWOT analysis",`<div class="g2" style="margin:0"><div><b>Strengths</b><br>${c.o}</div><div><b>Weaknesses</b><br>${c.k}</div><div><b>Opportunities</b><br>Demand from ${a[0]} and ${a[1]}; ${c.P[0]} trade links</div><div><b>Threats</b><br>${rk>50?"High macro and currency risk; ":""}local incumbents and regulation changes</div></div>`)+
q("Opportunities and risks",`<p>Opportunity: ${c.o}. Risk: ${c.k}. Overall risk index ${rk}/100.</p>`)+
q("Strategic recommendations",`<p>1) Pilot with ${a[0]}. 2) ${rk>50?"Enter through a local partner to limit exposure.":"Consider a direct entry with a small local team."} 3) Scale via ${c.P[0]} links once unit economics are proven.</p>`)+
q("Sources and references",`<p>${SRC.map(s=>s[0]+" ("+s[1]+")").join("; ")}.</p><p class="mu">Figures are sample data, 2024 estimates; verify with live sources before decisions.</p>`)}
V.reports=()=>`<div class="cd w row">${sel("c",CO(),"Country")}${sel("ind",IO(),"Industry")}<button id="cb" onclick="cp()" style="align-self:end">Copy report</button></div><div id="rp"><p class="mu">Research report generated ${new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})} from sample data.</p>${rep()}</div>`;
function cp(){let b=$("#cb"),m=t=>b.textContent=t;try{navigator.clipboard.writeText($("#rp").innerText).then(()=>m("Copied"),()=>m("Copy blocked: select the text instead"))}catch(e){m("Copy blocked: select the text instead")}}
V.learn=()=>`<div class="g2"><div class="cd"><h3>Study path</h3><table>${[["Ask the AI to explain a term","ai"],["Explore a country profile","country"],["Size a market for an industry","research"],["Map trade flows","trade"],["Test a strategy in the Strategy Lab","lab"],["Write a research report","reports"]].map((x,i)=>`<tr><td>${i+1}</td><td>${x[0]}</td><td><button onclick="nav('${x[1]}')">Open</button></td></tr>`).join("")}</table></div><div class="cd"><h3>Quick quiz</h3>${QZ.map((q,i)=>`<p><b>${q[0]}</b></p><div class="row">${q[1].map((o,j)=>`<button data-t="${o}" onclick="qa(${i},${j},this)">${o}</button>`).join("")}</div>`).join("")}</div></div><div class="cd w"><h3>Core topics</h3>${EDU.map(([t,b])=>`<details><summary>${t}</summary><p>${b}</p></details>`).join("")}</div><div class="cd"><h3>Glossary</h3><input placeholder="Search terms" oninput="gl(this.value)" style="width:100%;margin-bottom:8px"><div id="gl"></div></div>`;
function qa(i,j,e){e.parentNode.querySelectorAll("button").forEach(b=>b.textContent=b.dataset.t);e.textContent=e.dataset.t+(j==QZ[i][2]?" ✓":" ✗")}
function gl(q){q=q.toLowerCase();$("#gl").innerHTML=Object.entries(GL).filter(([k,v])=>(k+v).toLowerCase().includes(q)).map(([k,v])=>`<p><b>${k}</b><br>${v}</p>`).join("")||'<p class="mu">No matching term.</p>'}
V.ai=()=>`<div class="cd chat"><div class="msgs" id="ms"></div><div class="row" style="margin:8px 0">${["Tell me about Germany","Compare Japan and India","Best country for Technology","Risks in Nigeria","Explain tariff","How to enter Mexico"].map(x=>`<span class="tag" onclick="ask('${x}')">${x}</span>`).join("")}</div><div class="row"><input id="ci" placeholder="Ask about a country, industry or term" style="flex:1;min-width:0" onkeydown="if(event.key==='Enter')ask(this.value)"><button onclick="ask($('#ci').value)">Send</button></div></div><p class="mu">The assistant uses Claude when your viewer allows it, and otherwise answers from the sample data on this page. Figures are illustrative; verify with official sources.</p>`;
function chat(){let b=$("#ms");if(!b)return;b.innerHTML="";(CH.length?CH:[["a","Hi, I’m your research assistant. Ask about a country, an industry or a term, or pick a suggestion below."]]).forEach(([r,t])=>{let d=document.createElement("div");d.className="m "+r;d.textContent=t;b.append(d)});b.scrollTop=1e9}
function ans(q){let t=q.toLowerCase(),cs=C.filter(c=>t.includes(c.n.toLowerCase())).sort((a,b)=>t.indexOf(a.n.toLowerCase())-t.indexOf(b.n.toLowerCase())),I=Object.keys(IND).find(k=>t.includes(k.toLowerCase()))||S.ind,c=cs[0]||cy(S.c),g=Object.keys(GL).find(k=>t.includes(k.toLowerCase()));
if(g&&/explain|define|what does|what is|meaning/.test(t))return g+": "+GL[g];
if(cs.length>1&&/compare|vs|versus|and/.test(t)){let d=cs[1];return`${c.n} vs ${d.n}: GDP $${c.g}T vs $${d.g}T; growth ${c.gr}% vs ${d.gr}%; inflation ${c.i}% vs ${d.i}%; business score ${c.s} vs ${d.s}. Opportunity in ${I}: ${opp(c,I)} vs ${opp(d,I)}.`}
if(/best|top|which country|where should/.test(t))return`Top sample markets for ${I}: `+C.map(x=>[x.n,opp(x,I)]).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]+" ("+x[1]+"/100)").join(", ")+".";
if(/risk/.test(t))return`${c.n}: risk index ${risk(c)}/100. Main risks: ${c.k}. Inflation ${c.i}%, unemployment ${c.u}%.`;
if(/enter|expand|strategy|plan|start/.test(t))return`Entry plan for ${I} in ${c.n}: 1) Pilot with ${IND[I].a.split(",")[0]}. 2) ${risk(c)>50?"Use a local partner to limit risk.":"Enter directly with a small local team."} 3) Scale through ${c.P[0]} trade links. Test the numbers in the Strategy Lab.`;
if(/trade|export|import|partner/.test(t))return`${c.n} exports $${c.ex}B (${c.E.join(", ")}) and imports $${c.im}B (${c.M.join(", ")}). Main partners: ${c.P.join(", ")}.`;
if(g)return g+": "+GL[g];
if(cs.length||/tell|about|overview/.test(t))return`${c.n}: GDP $${c.g}T, growth ${c.gr}%, population ${c.p}M, inflation ${c.i}%, unemployment ${c.u}%. Industries: ${c.I.join(", ")}. Currency ${EX[c.c].split("|")[0]}. Opportunity: ${c.o}.`;
return"I can compare countries, rank markets for an industry, explain terms like tariff or FDI, outline risks, or draft an entry plan. Try “Compare Japan and India”."}
async function ask(q){q=(q||"").trim();if(!q)return;let i=$("#ci");if(i)i.value="";CH.push(["u",q]);let m=CH.push(["a","Thinking…"])-1;if(S.v!="ai")nav("ai");else chat();
try{if(!SM)throw 0;let p="You are the research assistant of Global Business Research, a platform for students and young entrepreneurs. Answer in plain text under 150 words, no markdown. Use the sample dataset below (illustrative 2024 estimates, not verified statistics) and say so when quoting its figures; for anything else use general knowledge and suggest verifying with the World Bank, IMF or UN Comtrade. Current selection: country "+cy(S.c).n+", industry "+S.ind+". Dataset columns: code|name|lon|lat|GDP $T|growth %|inflation %|unemployment %|population M|industries|exports|imports|partners|exports $B|imports $B|business score|opportunity|risk.\n"+R+"\n\n"+CH.slice(-8,-2).map(x=>(x[0]=="u"?"User: ":"Assistant: ")+x[1]).join("\n")+"\nUser: "+q+"\nAssistant:";let r=await SM(p,{cache:false,onText:({text})=>{CH[m][1]=text;chat()}});CH[m][1]=r.text}catch(e){CH[m][1]=ans(q)}
chat()}
function go(){document.querySelectorAll("aside a").forEach(a=>a.classList.toggle("on",a.dataset.k==S.v));$("#t").textContent=N[S.v];$("#v").innerHTML=V[S.v]();if(S.v=="lab")calc();if(S.v=="learn")gl("");if(S.v=="ai")chat();$("#fab").style.display=S.v=="ai"?"none":"block"}
function nav(k){S.v=k;try{location.hash=k}catch(e){}go();scrollTo(0,0)}
function pick(c){S.c=c;if(S.v=="trade"||S.v=="research")go();else nav("country")}
function srch(q){q=q.toLowerCase();let r=q?[...C.filter(c=>c.n.toLowerCase().includes(q)).map(c=>[c.n,`pick('${c.c}')`]),...Object.entries(N).filter(([k,t])=>t.toLowerCase().includes(q)).map(([k,t])=>[t+" (page)",`nav('${k}')`])]:[];$("#sr").style.display=r.length?"block":"none";$("#sr").innerHTML=r.map(x=>`<div style="padding:6px;cursor:pointer" onclick="${x[1]};$('#sr').style.display='none';$('#q').value=''">${x[0]}</div>`).join("")}
$("#nav").innerHTML='<div class="logo">Global <b>Business</b> Research</div>'+Object.entries(N).map(([k,t])=>`<a data-k="${k}" onclick="nav('${k}')">${t}</a>`).join("");
addEventListener("hashchange",()=>{let k=location.hash.slice(1);if(V[k]&&k!=S.v){S.v=k;go()}});
DS.load().then(d=>{C=d;let k=location.hash.slice(1);if(V[k])S.v=k;go()});
</script></body></html>
